[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-json-analyzer"
version = "0.5.0"
description = "A powerful CLI and Python library for analyzing, visualizing, exploring, and generating code from JSON data"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "MS-32154", email = "msttoffg@gmail.com"}
]
maintainers = [
    {name = "MS-32154", email = "msttoffg@gmail.com"}
]
keywords = [
    "json",
    "analyzer",
    "visualization",
    "json-statistics",
    "plot",
    "jmespath",
    "json-search",
    "cli",
    "interactive-cli",
    "data-analysis",
    "schema",
    "code-generation",
    "go",
    "json-to-go",
    "json-to-golang",
    "python",
    "pydantic",
    "dataclass",
    "json-to-python"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed"
]

dependencies = [
    "jmespath>=1.0.1",
    "rich>=13.0.0",
    "plotly>=5.0.0",
    "requests>=2.32.0",
    "jinja2>=3.0.0",
    "prompt-toolkit>=3.0.0",
]


[project.urls]
Homepage = "https://github.com/MS-32154/py-json-analyzer"
Documentation = "https://ms-32154.github.io/py-json-analyzer/"
Repository = "https://github.com/MS-32154/py-json-analyzer"
"Bug Tracker" = "https://github.com/MS-32154/py-json-analyzer/issues"
Changelog = "https://github.com/MS-32154/py-json-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
json_explorer = "json_explorer.main:main"

# Development tools (PEP 735): not published as an installable extra.
# `uv sync` installs the "dev" group by default; pip >= 25.1: `pip install --group dev`.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.17.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0",
    "pydantic>=2.0",  # compile-checks generated Pydantic models
    "jsonschema>=4.23",
]

[tool.setuptools.packages.find]
include = ["json_explorer*"]

[tool.setuptools.package-data]
"json_explorer" = ["py.typed"]
"json_explorer.codegen.languages.go" = ["templates/*.j2"]
"json_explorer.codegen.languages.python" = ["templates/*.j2"]
"json_explorer.codegen.languages.rust" = ["templates/*.j2"]
"json_explorer.codegen.languages.typescript" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--cov=json_explorer",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["json_explorer"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]


[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "jmespath.*",
    "plotly.*",
    "prompt_toolkit.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
src = ["json_explorer", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "PIE",
    "SIM",
    "RET",
    "PTH",     # pathlib
    "LOG",
    "G",       # logging format: lazy %-style args, no f-strings
    "RUF",
    "FURB",    # refurb: modern idioms
]
ignore = [
    "E501",    # long lines: the formatter handles code; long strings are fine
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports

