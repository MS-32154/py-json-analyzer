name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github json_explorer tests

      - name: Ruff format
        run: uv run ruff format --check json_explorer tests

      - name: Type check
        run: uv run mypy json_explorer

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.15" }
          - { os: macos-latest, python: "3.15" }
          - { os: windows-latest, python: "3.14" } # windows-curses (terminal UI)
          - { os: windows-latest, python: "3.15" } # no curses: fallback path
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # Generated Go code is type-checked with `go vet` (tests skip without Go)
      - uses: actions/setup-go@v7
        if: runner.os == 'Linux'
        with:
          go-version: stable
          cache: false

      # Generated TypeScript is checked with tsc, prettier and zod
      # (tests skip without JSON_EXPLORER_TS_TOOLS)
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: lts/*

      - name: Install TypeScript tools
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/ts-tools"
          npm install --prefix "$RUNNER_TEMP/ts-tools" --no-audit --no-fund \
            typescript@7 zod@4 prettier@3
          echo "JSON_EXPLORER_TS_TOOLS=$RUNNER_TEMP/ts-tools" >> "$GITHUB_ENV"

      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Test
        run: uv run pytest --no-cov -q -p no:cacheprovider
