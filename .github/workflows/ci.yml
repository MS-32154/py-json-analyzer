name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.15" }
          - { os: macos-latest, python: "3.15" }
          - { os: windows-latest, python: "3.14" } # windows-curses (terminal UI)
          - { os: windows-latest, python: "3.15" } # no curses: fallback path
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked --extra dev

      - name: Test
        run: uv run pytest --no-cov -q -p no:cacheprovider
