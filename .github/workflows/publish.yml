name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      # __version__ is read from package metadata, so pyproject.toml is the only source
      - name: Check release tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short)"
          echo "tag=$tag pyproject=$pkg"
          [[ "$tag" == "$pkg" ]]

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import json_explorer, sys; print(json_explorer.__version__); sys.exit(json_explorer.__version__ != '${GITHUB_REF_NAME#v}')"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/py-json-analyzer/
    # PyPI Trusted Publishing (OIDC): no API token. The PyPI project trusts
    # this repository, workflow (publish.yml) and environment (pypi).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10

      - name: Publish
        run: uv publish --trusted-publishing always
