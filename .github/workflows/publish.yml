name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Check release tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short)"
          lib="$(grep -Po '^__version__ = "\K[^"]+' json_explorer/__init__.py)"
          echo "tag=$tag pyproject=$pkg __init__=$lib"
          [[ "$tag" == "$pkg" && "$pkg" == "$lib" ]]

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import json_explorer, sys; print(json_explorer.__version__); sys.exit(json_explorer.__version__ != '${GITHUB_REF_NAME#v}')"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/py-json-analyzer/
    permissions:
      id-token: write # enables PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10

      - name: Publish
        run: uv publish
        env:
          # Remove this once Trusted Publishing is configured on PyPI.
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
